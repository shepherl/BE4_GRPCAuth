events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    # Exclude media types like image/png, image/jpeg
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Caching settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Upstreams for API
    upstream backend_write {
        server shopapi-master:8080;
    }

    upstream backend_read {
        server shopapi-master:8080 weight=2;
        server shopapi-replica1:8080 weight=1;
        server shopapi-replica2:8080 weight=1;
    }

    map $request_method $api_upstream {
        default backend_write;
        GET     backend_read;
    }

    # Перехват всех левых запросов по HTTP (включая голый IP) и редирект на домен
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://s21shop.duckdns.org$request_uri;
    }

    # Перехват всех левых запросов по HTTPS (включая голый IP) и редирект на домен
    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        return 301 https://s21shop.duckdns.org$request_uri;
    }

    # Основной рабочий сервер
    server {
        listen 443 ssl http2;
        server_name s21shop.duckdns.org;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Передаем информацию о HTTPS в Java, чтобы Swagger строил правильные URL
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            
            # Caching GET requests
            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
        }

        # Status page
        location = /status {
            stub_status on;
        }

        # pgAdmin
        location /admin/ {
            proxy_set_header X-Script-Name /admin;
            proxy_set_header Host $host;
            proxy_pass http://pgadmin/;
            
            # Not caching admin
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Swagger - /api/v1 -> /swagger/index.html
        location = /api/v1 {
            return 301 /swagger/index.html;
        }

        # Backend API Routing (/api/ -> /api/v1/)
        location /api/ {
            proxy_cache off;
            rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Handle swagger paths
        location /swagger/ {
            proxy_pass http://backend_write;
            proxy_set_header Host $host;
        }
        
        location /v3/api-docs {
            proxy_pass http://backend_write;
            proxy_set_header Host $host;
        }
    }
}
